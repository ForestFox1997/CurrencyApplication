services:

  postgres:
    image: postgres:16
    container_name: currency-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: currency_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d currency_db"]
      interval: 10s
      timeout: 10s
      retries: 10

  migration-service:
    build:
      context: .
      dockerfile: MigrationService/Dockerfile
    container_name: migration-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=currency_db;
        Username=admin;
        Password=password
    restart: "no"

  user-service:
    build:
      context: .
      dockerfile: UserService/Dockerfile
    container_name: user-service
    depends_on:
      migration-service:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=currency_db;
        Username=admin;
        Password=password
    ports:
      - "5001:8080"

  finance-service:
    build:
      context: .
      dockerfile: FinanceService/Dockerfile
    container_name: finance-service
    depends_on:
      migration-service:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=currency_db;
        Username=admin;
        Password=password
    ports:
      - "5002:8080"

  currency-worker:
    build:
      context: .
      dockerfile: CurrencyWorker/Dockerfile
    container_name: currency-worker
    depends_on:
      migration-service:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=currency_db;
        Username=admin;
        Password=password

  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: gateway
    depends_on:
      - user-service
      - finance-service
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=currency_db;
        Username=admin;
        Password=password

volumes:
  postgres_data:
