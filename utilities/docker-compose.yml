# docker-compose.yml для CurrencyApplication;
# Поднимает экземпляр PostgreSql 16, а затем выполняет скрипт создания баз данных init.sql;
services:
  postgres:
    image: postgres:16
    container_name: currency_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: